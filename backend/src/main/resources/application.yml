spring:
  application:
    name: swiftpay
  autoconfigure:
    # no in-memory default user (it would log a generated password); authentication is JWT only
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swiftpay}
    username: ${POSTGRES_USER:swiftpay}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  # Client IP = TCP peer address. X-Forwarded-For is NOT trusted. Behind a trusted reverse proxy, switch to
  # "native" and configure server.tomcat.remoteip.internal-proxies with the proxy addresses.
  forward-headers-strategy: none
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: ${APP_TIMEZONE:Europe/Istanbul}   # day/month boundaries for limits and statistics
  currency: TRY
  limits:                         # TRY; quoted so YAML does not turn them into floats
    per-transfer: "50000.00"
    daily: "100000.00"
    monthly: "500000.00"
  jwt:
    secret: ${JWT_SECRET:}                    # required; the app refuses to start without a real secret
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  rate-limit:                     # in-memory, per instance (see README)
    login-failures:               # failed logins per username + client IP
      capacity: 5
      window: 15m
    transfers:                    # POST /transfers per customer
      capacity: 30
      window: 1m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
