# SwiftPay SPA + API reverse proxy (nginx-unprivileged: runs as a non-root user, listens on 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    # API: same origin for the browser, so no CORS is needed. Authorization, Idempotency-Key and every other
    # request header are passed through unchanged; X-Trace-Id / Idempotent-Replayed / Retry-After come back.
    # X-Forwarded-For is OVERWRITTEN with the real peer address (never appended), so a client cannot spoof
    # its IP; the backend trusts this header only from this container (TRUSTED_PROXIES).
    # No add_header here: the backend sets its own security headers on API responses.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA entry point must always be revalidated so new deployments are picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (/transfers/42, /login, ...) fall back to index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
